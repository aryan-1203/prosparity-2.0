<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none">
  <title>Lifecycle stage props, drawn in a 960 by 440 panel. The vehicle sits at translate(160 40). Show one group per stage.</title>
  <!-- No text in this file: every label is an HTML string, so it can be translated. -->
  <g stroke="var(--v-ink, #004737)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <g id="prop-finance">
      <path d="M786 397 V186 H946 V397"/>
      <path d="M772 186 L792 142 H946 V186"/>
      <path d="M772 186 C772 200 800 200 800 186 C800 200 828 200 828 186 C828 200 856 200 856 186 C856 200 884 200 884 186 C884 200 912 200 912 186 C912 200 946 200 946 186"/>
      <rect x="808" y="232" width="56" height="165"/>
      <rect x="880" y="232" width="48" height="72"/>
      <path d="M892 256 H916 M892 272 H916"/>
      <g id="prop-finance-sheet">
        <rect x="38" y="214" width="84" height="112" rx="4" fill="var(--v-paper, #fff)"/>
        <path d="M54 240 H106 M54 258 H106 M54 276 H88"/>
        <path d="M54 302 L66 312 L86 292" stroke-width="3"/>
      </g>
    </g>

    <g id="prop-service">
