    <g id="prop-refinance">
      <path stroke-dasharray="2 10" stroke-width="3" d="M880 380 C950 200 800 26 480 22 C200 20 30 170 66 372"/>
      <path stroke-width="3" d="M52 356 L68 382 L88 360"/>
    </g>
  </g>
</svg>
