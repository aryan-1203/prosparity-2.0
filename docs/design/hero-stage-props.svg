      <path d="M116 84 H872" opacity="0.5"/>
      <rect x="28" y="232" width="62" height="165" rx="6" fill="var(--v-paper, #fff)"/>
      <rect x="40" y="248" width="38" height="28" rx="3"/>
      <path d="M90 300 C150 372 214 356 256 300"/>
    </g>

    <g id="prop-custody" opacity="0.5">
      <path d="M0 214 H960 M0 270 H960"/>
      <path d="M30 397 V176 L44 158 L58 176 V397 M270 397 V176 L284 158 L298 176 V397 M510 397 V176 L524 158 L538 176 V397 M750 397 V176 L764 158 L778 176 V397"/>
    </g>

    <g id="prop-resale">
      <path d="M690 130 C730 96 770 96 800 116"/>
      <rect x="780" y="116" width="150" height="104" rx="10" fill="var(--v-paper, #fff)"/>
      <circle cx="804" cy="140" r="6"/>
      <g stroke="none" fill="var(--v-cell-battron, #009B9E)">
        <rect x="798" y="168" width="20" height="30" rx="2"/>
        <rect x="822" y="168" width="20" height="30" rx="2"/>
        <rect x="846" y="168" width="20" height="30" rx="2"/>
        <rect x="870" y="168" width="20" height="30" rx="2"/>
        <rect x="894" y="168" width="20" height="30" rx="2"/>
      </g>
      <path d="M866 142 L878 152 L900 130" stroke-width="3"/>
