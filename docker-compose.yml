services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prosparity
      POSTGRES_PASSWORD: prosparity
      POSTGRES_DB: prosparity
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosparity"]
      interval: 3s
      retries: 20
  api:
    build: apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://prosparity:prosparity@postgres:5432/prosparity
      SITE_ORIGIN: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
